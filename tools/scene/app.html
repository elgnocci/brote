<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brote</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:transparent}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="vendor/three.min.js"></script>
<script src="scene.js"></script>
<script>
{
  /* Página que usa la app Android: la app llama Brote.setState(json) y Brote.dropLeaf(). */
  const canvas = document.getElementById('c');
  const scene = new BroteScene(canvas, { animate: true });
  new ResizeObserver(() => scene.resize()).observe(canvas);
  window.Brote = {
    setState: (s) => scene.setState(typeof s === 'string' ? JSON.parse(s) : s),
    dropLeaf: () => scene.dropLeaf(),
  };
}
</script>
</body>
</html>
